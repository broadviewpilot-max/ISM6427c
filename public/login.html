<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in | The Aimsir Foundation</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="/theme.js"></script>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo"><img src="/logo.png" width="360" height="100" alt="The Aimsir Foundation"><p>Inspiring the skies, changing lives.</p></div>
      <h1>Welcome</h1>
      <p class="muted">This operations tool holds confidential participant, mentor and donor information. Enter the board password to continue.</p>
      <form id="form" autocomplete="off">
        <div class="field">
          <label for="pw">Board password</label>
          <input id="pw" name="password" type="password" required autofocus autocomplete="current-password">
        </div>
        <div id="err" class="banner err" role="alert" hidden></div>
        <button class="btn primary" id="go" type="submit">Sign in</button>
      </form>
      <p class="small muted" style="margin-top:1rem">Access is limited to Foundation board members. Activity is logged.</p>
    </div>
  </div>
  <script src="/login.js"></script>
</body>
</html>
